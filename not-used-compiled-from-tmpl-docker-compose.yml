version: "2"
services:

  policy-init:
    image: alpine:3.20
    volumes:
      - chromium_policies:/etc/chromium/policies
    command: >
      sh -c 'mkdir -p /etc/chromium/policies/managed &&
             printf %s "{\"AutoplayAllowed\": true, \"AutoplayAllowlist\": [\"https://*\"]}" \
             >/etc/chromium/policies/managed/autoplay.json'
    restart: "no"

  anthias-wifi-connect:
    build:
      context: .
      dockerfile: docker/Dockerfile.wifi-connect.template
    depends_on:
      - anthias-viewer
    environment:
      PORTAL_LISTENING_PORT: 8000
      CHECK_CONN_FREQ: 10
      PORTAL_SSID: 'Anthias WiFi Connect'
      DBUS_SYSTEM_BUS_ADDRESS: 'unix:path=/host/run/dbus/system_bus_socket'
    network_mode: host
    privileged: true
    labels:
      io.balena.features.dbus: "1"
      io.balena.features.firmware: "1"

  anthias-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.template
    environment:
      - HOME=/data
      - LISTEN=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    devices:
      - "/dev/vchiq:/dev/vchiq"
    restart: always
    volumes:
      - resin-data:/data
    labels:
      io.balena.features.supervisor-api: '1'
  
  anthias-viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile.viewer.template
    depends_on:
      - anthias-server
    environment:
      - HOME=/data
      - PORT=80
      - NOREFRESH=1
      - LISTEN=anthias-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    restart: always
    shm_size: 512m
    volumes:
      - resin-data:/data
      - chromium_policies:/etc/chromium/policies
    labels:
      io.balena.features.supervisor-api: '1'

  anthias-websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket.template
    depends_on:
      - anthias-server
    environment:
      - HOME=/data
      - LISTEN=0.0.0.0
    restart: always
    volumes:
      - resin-data:/data

  anthias-celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery.template
    depends_on:
      - anthias-server
      - redis
    environment:
      - HOME=/data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    devices:
      - "/dev/vchiq:/dev/vchiq"
    restart: always
    volumes:
      - resin-data:/data
    labels:
      io.balena.features.supervisor-api: '1'

  redis:
    image: redis:7.0
    ports:
      - 127.0.0.1:6379:6379
    restart: always
    volumes:
      - redis-data:/var/lib/redis

  anthias-nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx.template
    ports:
      - 80:80
    environment:
      - HOME=/data
    depends_on:
      - anthias-server
      - anthias-websocket
    restart: always
    volumes:
      - resin-data:/data:ro

volumes:
  resin-data:
  redis-data:
  chromium_policies:
  
